name: Build and Release JARVIS AI APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: Restore Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
          base64 -d debug.keystore.base64 > debug.keystore || true
        fi
        if [ ! -f debug.keystore ]; then
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
        fi
        ls -la debug.keystore

    - name: Build Debug APK
      run: |
        chmod +x ./gradlew || true
        ./gradlew :app:assembleDebug --no-daemon || gradle :app:assembleDebug --no-daemon

    - name: Verify APK Generated
      run: |
        ls -lh app/build/outputs/apk/debug/app-debug.apk

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS-AI-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Release with APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.0.0-build-${{ github.run_number }}
        name: JARVIS AI APK v1.0.0
        draft: false
        prerelease: false
        generate_release_notes: true
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
